- id: copdem90_elevation_static
  name: Elevation (Copernicus 90m DEM, static)
  short_name: Elevation
  variable: elevation
  description: >-
    Height above sea level at 90 m, worldwide. A surface model, so it records the top of tree
    canopy and buildings rather than bare ground. Needs no account, and at 90 m a whole country
    fits comfortably. The 30 m DEM is in OCS core (copdem30_elevation_static).
  # No period_type: elevation has no time axis, so the store is (y, x).
  sync:
    kind: static
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
  ingestion:
    plugin: ocs_plugins.rasters.copdem90.CopDEM90Plugin
  standard_name: surface_altitude
  units: m
  resolution: 90 m x 90 m
  source: Copernicus DEM GLO-90 (AWS Open Data)
  source_url: https://registry.opendata.aws/copernicus-dem/
  license:
    name: Licence to Use Copernicus DEM
    url: https://spacedata.copernicus.eu/documents/20123/121286/CSCDA_ESA_Mission-specific+Annex_31_Oct_22.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
    - name: AWS Open Data
      url: https://registry.opendata.aws/copernicus-dem/
  display:
    colormap: viridis
    range: [0, 2000]
