- id: modis_landcover_yearly
  name: Land cover class (MODIS MCD12Q1, yearly)
  short_name: Land cover
  description: >-
    Land cover class of each 500 m cell, worldwide, yearly from 2001, in the 17 IGBP classes of
    MODIS MCD12Q1. MODIS science collection ends in 2027, so the record stops then. Needs an
    Earthdata Login.
  variable: land_cover
  period_type: yearly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2001"
      resolution: P1Y
  ingestion:
    plugin: ocs_plugins.rasters.modis_landcover.MODISLandCoverPlugin
    resampling: mode
  classes:
    - { value: 1, label: "Evergreen needleleaf forest", color: "#05450a" }
    - { value: 2, label: "Evergreen broadleaf forest", color: "#086a10" }
    - { value: 3, label: "Deciduous needleleaf forest", color: "#54a708" }
    - { value: 4, label: "Deciduous broadleaf forest", color: "#78d203" }
    - { value: 5, label: "Mixed forest", color: "#009900" }
    - { value: 6, label: "Closed shrubland", color: "#c6b044" }
    - { value: 7, label: "Open shrubland", color: "#dcd159" }
    - { value: 8, label: "Woody savanna", color: "#dade48" }
    - { value: 9, label: "Savanna", color: "#fbff13" }
    - { value: 10, label: "Grassland", color: "#b6ff05" }
    - { value: 11, label: "Permanent wetland", color: "#27ff87" }
    - { value: 12, label: "Cropland", color: "#c24f44" }
    - { value: 13, label: "Urban and built-up", color: "#a5a5a5" }
    - { value: 14, label: "Cropland and natural vegetation mosaic", color: "#ff6d4c" }
    - { value: 15, label: "Snow and ice", color: "#69fff8" }
    - { value: 16, label: "Barren", color: "#f9ffa4" }
    - { value: 17, label: "Water", color: "#1c0dff" }
  units: "1"
  resolution: 500 m x 500 m
  source: MODIS Terra and Aqua MCD12Q1 v061, IGBP classification (NASA LP DAAC)
  source_url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-mcd12q1-061
  license:
    name: NASA Earth Science Data
    url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance
  providers:
    - name: NASA LP DAAC
      url: https://www.earthdata.nasa.gov/centers/lp-daac
  display:
    colormap: viridis
    range: [1, 17]
