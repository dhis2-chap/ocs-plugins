- id: worldpop_agesex_global2_100m
  name: Population by age and sex (WorldPop Global2, 100m)
  short_name: Age/sex population
  description: >-
    People per 100 m grid cell split by age band and sex, worldwide. Yearly estimates and
    projections for 2015-2030 from the WorldPop Global2 R2025A release. Slow to ingest: WorldPop
    publishes about 40 GeoTIFFs per country and year, one per sex and age band, and each is
    downloaded in turn.
  variable: population
  period_type: yearly
  # Runs 2015-2030, so periods straddle now. Requires an explicit start
  # (defaulting to "now" would drop the historical half), but lets the ingest
  # form offer the full range instead of truncating at today.
  temporal_direction: spanning
  sync:
    kind: release
    # The release identity, independent of period_type: WorldPop reissues this
    # revision, not a calendar year.
    version:
      value: R2025A
      authority: worldpop
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2015"
      end: "2030"
      resolution: P1Y
  ingestion:
    plugin: ocs_plugins.rasters.worldpop_agesex.WorldPopAgeSexYearlyPlugin
    params:
      revision: R2025A
      resolution: 100m
  units: people
  resolution: 100m x 100m
  source: WorldPop Global2
  source_url: https://hub.worldpop.org/project/categories?id=8
  license: CC-BY-4.0
  providers:
    - name: WorldPop, University of Southampton
      url: https://hub.worldpop.org/
  display:
    colormap: reds
    range: [0.5, 10.0]
