- id: chelsa_temperature_monthly
  name: Temperature (CHELSA v2.1, monthly, 1 km)
  short_name: Temperature
  description: >-
    Monthly mean near-surface air temperature at about 1 km, worldwide, from January 1980 to
    December 2021, in degrees Celsius. CHELSA downscales ERA5 using terrain, so it resolves
    mountain valleys and slopes that coarser reanalyses average over. The series is no longer
    extended. Needs no account.
  standard_name: air_temperature
  variable: temperature
  period_type: monthly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 84]
    temporal:
      begin: "1980-01"
      end: "2021-12"
      resolution: P1M
  ingestion:
    plugin: ocs_plugins.rasters.chelsa.CHELSATemperaturePlugin
  units: degC
  cell_methods: "time: mean"
  resolution: 1 km x 1 km
  source: CHELSA v2.1 (WSL)
  source_url: https://www.chelsa-climate.org/
  license: CC0-1.0
  providers:
    - name: Swiss Federal Institute for Forest, Snow and Landscape Research (WSL)
      url: https://chelsa-climate.org/
  display:
    colormap: rdbu_r
    range: [-10.0, 35.0]
