- id: viirs_ndvi_monthly
  name: NDVI (VIIRS, monthly)
  short_name: NDVI
  description: >-
    Normalized Difference Vegetation Index at 500 m, worldwide, from 2012 onwards. Monthly mean of
    the 16-day composites from the VIIRS instruments on Suomi NPP, NOAA-20 and NOAA-21 centred in
    the month, with cloudy, snowy and fill pixels removed. Values run from -0.2 to 1; dense green
    vegetation is above 0.6, bare soil and sand near 0.1. Needs an Earthdata Login.
  standard_name: normalized_difference_vegetation_index
  variable: ndvi
  period_type: monthly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2012-02"
      resolution: P1M
  ingestion:
    plugin: ocs_plugins.rasters.viirs_vi.VIIRSVegetationIndexMonthlyPlugin
    params:
      index: ndvi
  units: "1"
  cell_methods: "time: mean"
  resolution: 500 m x 500 m
  source: VIIRS VNP13A1/VJ113A1/VJ213A1 v002 (NASA LP DAAC)
  source_url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
  license:
    name: NASA Earth Science Data
    url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance
  providers:
    - name: NASA LP DAAC
      url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
  display:
    colormap: viridis
    range: [0.0, 0.8]

- id: viirs_evi_monthly
  name: EVI (VIIRS, monthly)
  short_name: EVI
  description: >-
    Enhanced Vegetation Index at 500 m, worldwide, from 2012 onwards. Monthly mean of the 16-day
    composites from the VIIRS instruments on Suomi NPP, NOAA-20 and NOAA-21 centred in the month,
    with cloudy, snowy and fill pixels removed. Like NDVI but less saturated over dense vegetation
    and less sensitive to soil background. Needs an Earthdata Login.
  standard_name: enhanced_vegetation_index
  variable: evi
  period_type: monthly
  sync:
    kind: temporal
    execution: append
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2012-02"
      resolution: P1M
  ingestion:
    plugin: ocs_plugins.rasters.viirs_vi.VIIRSVegetationIndexMonthlyPlugin
    params:
      index: evi
  units: "1"
  cell_methods: "time: mean"
  resolution: 500 m x 500 m
  source: VIIRS VNP13A1/VJ113A1/VJ213A1 v002 (NASA LP DAAC)
  source_url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
  license:
    name: NASA Earth Science Data
    url: https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance
  providers:
    - name: NASA LP DAAC
      url: https://www.earthdata.nasa.gov/data/catalog/lpcloud-vnp13a1-002
  display:
    colormap: viridis
    range: [0.0, 0.6]
