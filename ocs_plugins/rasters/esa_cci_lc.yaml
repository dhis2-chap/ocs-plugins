- id: esacci_landcover_fraction_yearly
  name: Land cover fractions (ESA CCI / C3S, yearly)
  short_name: Land cover fractions
  description: >-
    Share of each 1 km cell covered by each of ten land cover groups (cropland, tree cover,
    shrubland, grassland, sparse vegetation, wetland, urban, bare, water, snow and ice), from the
    300 m ESA CCI / C3S land cover maps, yearly from 1992 to 2022. Averaging a group over a
    district gives the share of the district it covers. The groups merge the 37 published classes
    following the IPCC land categories, with shrubland, sparse vegetation and bare land kept apart.
    For the share of each of the 37 classes at 300 m, use OCS core's esacci_landcover_class_yearly
    with aggregate_spatial_classes.
    Needs a Copernicus CDS key, with the dataset's licence accepted once in the browser.
  variable: land_cover_fraction
  period_type: yearly
  sync:
    kind: release
    version:
      value: v2.1.1
      authority: esa-cci-lc
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "1992"
      end: "2022"
      resolution: P1Y
  ingestion:
    plugin: ocs_plugins.rasters.esa_cci_lc.ESACCILandCoverFractionPlugin
    params:
      block: 3
  units: "1"
  cell_methods: "area: mean"
  resolution: 1 km x 1 km
  source: ESA CCI / C3S land cover v2.0.7 and v2.1.1 (Copernicus Climate Data Store)
  source_url: https://cds.climate.copernicus.eu/datasets/satellite-land-cover
  license:
    name: Licence to Use Copernicus Products
    url: https://apps.ecmwf.int/datasets/licences/satellite-land-cover/
  providers:
    - name: ESA Climate Change Initiative and Copernicus Climate Change Service (C3S)
      url: https://climate.esa.int/en/projects/land-cover/
    - name: Copernicus Climate Data Store
      url: https://cds.climate.copernicus.eu/
  display:
    colormap: viridis
    range: [0.0, 1.0]
