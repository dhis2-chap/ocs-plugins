- id: copernicus_dem_elevation
  name: Elevation (Copernicus 30m DEM, static)
  short_name: Elevation
  variable: elevation
  description: >-
    Height above sea level at 30 m, worldwide. A surface model, so it records the top of tree
    canopy and buildings rather than bare ground. Needs no account. A large country at 30 m takes
    several GB of memory while it is ingested; the 90 m version takes a ninth of that.
  period_type: yearly
  sync:
    kind: release
    execution: rematerialize
    version:
      value: "2021_1"
      authority: copernicus
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2021"
      end: "2021"
      resolution: P1Y
  ingestion:
    plugin: ocs_plugins.rasters.copernicus_dem.CopernicusDEMPlugin
    params:
      resolution: 30
  standard_name: surface_altitude
  units: m
  resolution: 30 m x 30 m
  source: Copernicus DEM GLO-30 (AWS Open Data)
  source_url: https://registry.opendata.aws/copernicus-dem/
  license:
    name: Licence to Use Copernicus DEM
    url: https://spacedata.copernicus.eu/documents/20123/121286/CSCDA_ESA_Mission-specific+Annex_31_Oct_22.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
    - name: AWS Open Data
      url: https://registry.opendata.aws/copernicus-dem/
  display:
    colormap: viridis
    range: [0, 2000]

- id: copdem90_elevation_static
  name: Elevation (Copernicus 90m DEM, static)
  short_name: Elevation
  variable: elevation
  description: >-
    Height above sea level at 90 m, worldwide. A surface model, so it records the top of tree
    canopy and buildings rather than bare ground. Needs no account, and at 90 m a whole country
    fits comfortably, unlike the 30 m version.
  period_type: yearly
  sync:
    kind: release
    execution: rematerialize
    version:
      value: "2021_1"
      authority: copernicus
  extents:
    spatial:
      bbox: [-180, -90, 180, 90]
    temporal:
      begin: "2021"
      end: "2021"
      resolution: P1Y
  ingestion:
    plugin: ocs_plugins.rasters.copernicus_dem.CopernicusDEMPlugin
    params:
      resolution: 90
  standard_name: surface_altitude
  units: m
  resolution: 90 m x 90 m
  source: Copernicus DEM GLO-90 (AWS Open Data)
  source_url: https://registry.opendata.aws/copernicus-dem/
  license:
    name: Licence to Use Copernicus DEM
    url: https://spacedata.copernicus.eu/documents/20123/121286/CSCDA_ESA_Mission-specific+Annex_31_Oct_22.pdf
  providers:
    - name: Copernicus
      url: https://www.copernicus.eu/
    - name: AWS Open Data
      url: https://registry.opendata.aws/copernicus-dem/
  display:
    colormap: viridis
    range: [0, 2000]
