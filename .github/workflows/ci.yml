name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly against OCS main, so a change to the plugin contract shows up here.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --upgrade-package open-climate-service
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Test
        run: uv run pytest -q
