[project]
name = "ocs-plugins"
version = "0.1.0"
description = "Community dataset plugins for the Open Climate Service"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Not pinned: the instance installing these plugins decides which OCS revision it runs.
dependencies = ["open-climate-service", "boto3>=1.34", "earthengine-api>=1.0", "pyhdf>=0.11", "xee>=0.1.2,<0.2"]

[project.urls]
Repository = "https://github.com/dhis2-chap/ocs-plugins"

[project.entry-points."open_climate_service.plugins"]
ocs_plugins = "ocs_plugins"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocs_plugins"]

[dependency-groups]
# Development and CI test against OCS main with its server stack, which the plugins need.
dev = ["open-climate-service[server]", "pytest>=8", "ruff>=0.6"]

[tool.uv]
# The same overrides OCS itself declares: they relax stale upstream pins and are not inherited
# by a project that depends on OCS. Keep in step with OCS main's pyproject.toml.
override-dependencies = [
    "geojson-pydantic>=2.1.0",
    "zarr>=3.1.6",
    "pyarrow>=19.0",
    "xarray>=2025.12.0",
    "dask>=2024.1.0",
    "dask-geopandas>=0.4",
    "geopandas>=1.1",
    "xvec>=0.3",
    "rioxarray>=0.17",
    "pystac>=1.10",
]

[tool.uv.sources]
open-climate-service = { git = "https://github.com/dhis2/open-climate-service", branch = "main" }

# The same rules as OCS core, so a plugin can move between the two unchanged.
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
select = ["E", "W", "F", "I", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/__init__.py" = ["D104"]
"ocs_plugins/**/*.py" = ["D102", "D105", "D107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
